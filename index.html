<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kyocera Service Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --red:#C8102E;
    --red-dk:#9C0C23;
    --ink:#1D1D1B;
    --ink-2:#4A4A48;
    --ink-3:#8A8A87;
    --line:#DCDCD8;
    --panel:#F4F4F2;
    --white:#FFFFFF;
    --jam:#C8102E;
    --err:#B5722A;
    --sys:#3D6FB4;
    --other:#4A8A6F;
    --drum:#B5722A;
    --dev:#3D6FB4;
    --belt:#6B4E9C;
    --fuser:#C8102E;
    --ok:#2E7D52;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--white);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  code,.mono{font-family:"SFMono-Regular",Consolas,"Roboto Mono","Liberation Mono",monospace}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  :focus-visible{outline:2px solid var(--red);outline-offset:1px}

  header{border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:30}
  .bar{display:flex;align-items:baseline;gap:16px;padding:14px 20px 12px}
  .mark{font-size:20px;font-weight:700;letter-spacing:.22em;color:var(--red);line-height:1}
  .mark span{color:var(--ink);font-weight:400;letter-spacing:.06em;font-size:12px;margin-left:12px;white-space:nowrap}
  .rule{height:3px;background:var(--red)}

  .shell{display:grid;grid-template-columns:265px minmax(0,1fr);height:calc(100vh - 61px)}
  .pane{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .pane-head{padding:13px 16px 11px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  .pane-head h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:700}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}

  .search{padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--white)}
  .search input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;font-size:14px;background:var(--white)}
  .search input:focus{border-color:var(--red);outline:none}

  /* machines */
  aside{background:var(--panel);border-right:1px solid var(--line)}
  aside .search{background:var(--panel)}
  .grp{padding:11px 16px 5px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .mch{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 16px;font-size:14px;color:var(--ink);border-left:3px solid transparent}
  .mch:hover{background:#EAEAE7}
  .mch.on{background:var(--white);border-left-color:var(--red);font-weight:700}
  .mch .miss{display:inline-block;margin-left:6px;font-size:10px;color:var(--ink-3);letter-spacing:.04em}

  /* right side */
  .work{display:flex;flex-direction:column;min-width:0}
  .mhead{padding:14px 20px 0;border-bottom:1px solid var(--line);background:var(--white);flex:0 0 auto}
  .mhead h1{margin:0 0 11px;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .tabs{display:flex;gap:26px}
  .tab{border:0;background:none;padding:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--red);border-bottom-color:var(--red)}
  .tab .ct{color:var(--ink-3);font-weight:400;margin-left:5px;letter-spacing:0}

  .content{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}

  /* parts */
  .parts{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 60px;width:100%}
  .pcard{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:2px;padding:13px 15px 14px;margin-bottom:12px;max-width:640px}
  .pcard[data-c="Drum"]{border-left-color:var(--drum)}
  .pcard[data-c="Developer"]{border-left-color:var(--dev)}
  .pcard[data-c="Transfer belt"]{border-left-color:var(--belt)}
  .pcard[data-c="Fuser"]{border-left-color:var(--fuser)}
  .pcard h3{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:6px 9px;font-size:15px;font-weight:700}
  .chip button{border:0;background:none;color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 3px}
  .chip button:hover{color:var(--red)}
  .ovr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ovr input{flex:1 1 190px;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:2px;font-size:14px}
  .ovr input:focus{border-color:var(--red);outline:none}
  .ovr .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
  .ovr .rst{border:0;background:none;color:var(--red);font-size:12px;padding:4px 2px;text-decoration:underline}
  .mine{border-left-style:solid}
  .mineTag{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);font-weight:700}
  .none{color:var(--ink-3);font-size:14px;font-style:italic}

  /* codes */
  .clist{width:302px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .filters{display:flex;gap:5px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
  .fbtn{border:1px solid var(--line);background:var(--white);border-radius:2px;padding:4px 8px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-2)}
  .fbtn.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
  .crow{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 14px;border-bottom:1px solid #EFEFEC;align-items:baseline}
  .crow:hover{background:var(--panel)}
  .crow.on{background:var(--panel)}
  .crow .cd{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:700;flex:0 0 auto;width:52px}
  .crow .ctx{font-size:12.5px;color:var(--ink-2);line-height:1.35;min-width:0}
  .crow.j .cd{color:var(--jam)} .crow.c .cd{color:var(--err)}
  .crow.f .cd{color:var(--sys)} .crow.o .cd{color:var(--other)}

  .proc{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 24px 70px;min-width:0}
  .proc .ph{border-bottom:2px solid var(--ink);padding-bottom:11px;margin-bottom:15px}
  .proc .pc{font-family:"SFMono-Regular",Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:.02em}
  .proc .pt{font-size:15px;margin-top:5px;color:var(--ink-2)}
  .proc .pd{font-size:14px;line-height:1.55;margin:0 0 18px;color:var(--ink-2);max-width:70ch}
  .variant{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  .step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #EFEFEC;max-width:78ch}
  .tick{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line);border-radius:50%;background:none;padding:0;margin-top:1px;color:transparent;font-size:13px;font-weight:700;line-height:18px}
  .tick.on{background:var(--ok);border-color:var(--ok);color:var(--white)}
  .step.done .sbody{opacity:.45}
  .sbody{min-width:0}
  .sn{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
  .sc{font-size:14.5px;font-weight:700;margin:2px 0 4px}
  .sl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
  .sx{font-size:14px;line-height:1.5;color:var(--ink-2);margin:3px 0}
  .empty{padding:44px 24px;color:var(--ink-3);font-size:14px;max-width:46ch;line-height:1.6}

  .back{display:none}
  @media (max-width:860px){
    .shell{display:block;height:auto}
    aside,.work{height:auto}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    .content{display:block}
    .clist{width:auto;border-right:0;border-bottom:1px solid var(--line)}
    .scroll,.parts,.proc{overflow:visible}
    .shell.v-machines .work{display:none}
    .shell.v-machines aside{display:flex;min-height:calc(100vh - 61px)}
    .shell.v-list aside,.shell.v-proc aside{display:none}
    .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--red);font-size:13px;font-weight:700;padding:10px 20px 0}
    .mhead{padding-top:4px}
    .proc{padding:16px 18px 60px}
    .parts{padding:16px 18px 60px}
  }

  #load{position:fixed;inset:0;background:var(--white);display:flex;align-items:center;justify-content:center;z-index:99;font-size:13px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>

<div id="load">Loading service data…</div>

<header>
  <div class="bar"><div class="mark">KYOCERA<span>SERVICE BOARD — PARTS, JAMS &amp; ERROR CODES</span></div></div>
  <div class="rule"></div>
</header>

<div class="shell v-machines" id="shell">

  <aside class="pane">
    <div class="search"><input id="ms" type="search" placeholder="Search machines" autocomplete="off"></div>
    <div class="scroll" id="mlist"></div>
  </aside>

  <div class="pane work" id="work">
    <button class="back" id="bk1">‹ Machines</button>
    <div class="mhead">
      <h1 id="mname">Select a machine</h1>
      <div class="tabs">
        <button class="tab on" id="tabP">Parts</button>
        <button class="tab" id="tabC">Jams &amp; errors <span class="ct" id="ccount"></span></button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="parts" id="parts"></div>
      <div class="clist" id="clist" style="display:none">
        <div class="search"><input id="cs" type="search" placeholder="Search code or keyword" autocomplete="off"></div>
        <div class="filters" id="filters"></div>
        <div class="scroll" id="crows"></div>
      </div>
      <div class="proc" id="proc" style="display:none"></div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- storage: real localStorage when available, memory otherwise ---------- */
  var mem = {};
  var store = {
    get: function(k){
      try { var v = window.localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : null) : v; }
      catch(e){ return (k in mem) ? mem[k] : null; }
    },
    set: function(k,v){ mem[k]=v; try { window.localStorage.setItem(k,v); } catch(e){} },
    del: function(k){ delete mem[k]; try { window.localStorage.removeItem(k); } catch(e){} }
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- data ---------- */
  var DATA, MODELS, MANUALS;
  function decode(){
    var b64 = document.getElementById('blob').textContent.trim();
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    DATA = JSON.parse(pako.ungzip(bytes, {to:'string'}));
    MODELS = DATA.d; MANUALS = DATA.m;
  }

  var CATS = ['Drum','Developer','Transfer belt','Fuser'];
  var state = { mi:-1, tab:'parts', code:null, filter:'all', ticks:{} };

  function codesFor(mi){
    var key = MODELS[mi][2];
    if(!key || !MANUALS[key]) return null;
    return MANUALS[key];
  }
  function kind(c){
    var p = c.charAt(0);
    if(p==='J') return 'j';
    if(p==='C') return 'c';
    if(p==='F'||p==='U') return 'f';
    return 'o';
  }
  var KINDLABEL = {all:'All', j:'Jams', c:'Errors', f:'Fax / scan', o:'Other'};

  /* ---------- machines ---------- */
  function buildMachines(q){
    q = (q||'').toLowerCase().trim();
    var host = document.getElementById('mlist'), html = '', lastG = null, shown = 0;
    for (var i=0;i<MODELS.length;i++){
      var m = MODELS[i];
      if (q && m[0].toLowerCase().indexOf(q) < 0) continue;
      if (m[1] !== lastG){ html += '<div class="grp">'+esc(m[1])+'</div>'; lastG = m[1]; }
      var miss = '';
      if (!m[4]) miss = '<span class="miss">codes only</span>';
      else if (!m[2]) miss = '<span class="miss">parts only</span>';
      html += '<button class="mch'+(i===state.mi?' on':'')+'" data-i="'+i+'">'+esc(m[0])+miss+'</button>';
      shown++;
    }
    if (!shown) html = '<div class="empty">No machine matches that. Try a shorter search, like “4054” or “MZ”.</div>';
    host.innerHTML = html;
  }

  /* ---------- parts ---------- */
  function okey(mi,cat){ return 'kyo:ovr:'+MODELS[mi][0]+':'+cat; }

  function buildParts(){
    var mi = state.mi, host = document.getElementById('parts');
    if (mi < 0){ host.innerHTML = '<div class="empty">Pick a machine on the left to see its drum, developer, transfer belt and fuser.</div>'; return; }
    var m = MODELS[mi], p = m[3], html = '';
    if (!m[4]){
      html += '<div class="empty">No parts manual is bundled for the '+esc(m[0])+'. Jam and error codes are still available under the next tab.<br><br>You can still type the numbers you use below and they’ll be saved.</div>';
    }
    for (var i=0;i<CATS.length;i++){
      var cat = CATS[i], vals = p[cat] || [], ovr = store.get(okey(mi,cat));
      html += '<div class="pcard'+(ovr?' mine':'')+'" data-c="'+cat+'">';
      html += '<h3>'+esc(cat)+(ovr?'<span class="mineTag">yours</span>':'')+'</h3>';
      if (ovr){
        html += '<div class="chips"><span class="chip">'+esc(ovr)+
                '<button data-copy="'+esc(ovr)+'">Copy</button></span></div>';
        if (vals.length) html += '<div class="sx" style="margin:0 0 9px">Manual says: '+esc(vals.join(', '))+'</div>';
      } else if (vals.length){
        html += '<div class="chips">';
        for (var v=0;v<vals.length;v++)
          html += '<span class="chip">'+esc(vals[v])+'<button data-copy="'+esc(vals[v])+'">Copy</button></span>';
        html += '</div>';
      } else {
        html += '<div class="chips"><span class="none">Not listed in the bundled manual.</span></div>';
      }
      html += '<div class="ovr"><span class="lbl">Your number</span>'+
              '<input type="text" data-cat="'+esc(cat)+'" value="'+esc(ovr||'')+'" placeholder="Type to override and save">'+
              (ovr?'<button class="rst" data-reset="'+esc(cat)+'">Reset to manual</button>':'')+'</div>';
      html += '</div>';
    }
    host.innerHTML = html;
  }

  /* ---------- codes ---------- */
  function buildFilters(){
    var codes = codesFor(state.mi), host = document.getElementById('filters');
    if (!codes){ host.innerHTML=''; return; }
    var have = {all:true};
    for (var c in codes) have[kind(c)] = true;
    var html = '';
    ['all','j','c','f','o'].forEach(function(k){
      if (!have[k]) return;
      html += '<button class="fbtn'+(state.filter===k?' on':'')+'" data-f="'+k+'">'+KINDLABEL[k]+'</button>';
    });
    host.innerHTML = html;
  }

  function buildCodes(q){
    var host = document.getElementById('crows'), codes = codesFor(state.mi);
    if (!codes){
      host.innerHTML = '<div class="empty">No troubleshooting manual is bundled for this machine, so there are no codes to show. Its parts are on the Parts tab.</div>';
      return;
    }
    q = (q||'').toLowerCase().trim();
    var keys = Object.keys(codes).sort(), html = '', n = 0;
    for (var i=0;i<keys.length;i++){
      var c = keys[i], k = kind(c);
      if (state.filter !== 'all' && k !== state.filter) continue;
      var title = codes[c][0][0] || '';
      if (q && (c.toLowerCase().indexOf(q) < 0 && title.toLowerCase().indexOf(q) < 0)) continue;
      html += '<button class="crow '+k+(c===state.code?' on':'')+'" data-c="'+c+'">'+
              '<span class="cd">'+esc(c)+'</span><span class="ctx">'+esc(title)+'</span></button>';
      n++;
    }
    if (!n) html = '<div class="empty">Nothing matches that here. Try the code on its own, like “6000”, or switch the filter above.</div>';
    host.innerHTML = html;
  }

  function buildProc(){
    var host = document.getElementById('proc'), codes = codesFor(state.mi);
    if (!codes || !state.code){
      host.innerHTML = '<div class="empty">Pick a code to see the manual’s repair steps.</div>';
      return;
    }
    var recs = codes[state.code], html = '';
    html += '<div class="ph"><div class="pc">'+esc(state.code)+'</div>'+
            '<div class="pt">'+esc(recs[0][0])+'</div></div>';
    for (var r=0;r<recs.length;r++){
      var rec = recs[r];
      if (recs.length > 1)
        html += '<div class="variant">Case '+(r+1)+' of '+recs.length+(rec[0]!==recs[0][0]?' — '+esc(rec[0]):'')+'</div>';
      if (rec[1]) html += '<p class="pd">'+esc(rec[1])+'</p>';
      var steps = rec[2];
      if (!steps.length){
        html += '<div class="empty" style="padding:6px 0">The manual gives a cause for this code but no step table.</div>';
        continue;
      }
      for (var s=0;s<steps.length;s++){
        var id = r+'-'+s, on = state.ticks[id];
        html += '<div class="step'+(on?' done':'')+'">'+
                '<button class="tick'+(on?' on':'')+'" data-t="'+id+'" aria-label="Mark step done">&#10003;</button>'+
                '<div class="sbody"><div class="sn">STEP '+(s+1)+'</div>'+
                '<div class="sc">'+esc(steps[s][0])+'</div>'+
                (steps[s][1]?'<div class="sx"><span class="sl">Cause</span>'+esc(steps[s][1])+'</div>':'')+
                (steps[s][2]?'<div class="sx"><span class="sl">Do</span>'+esc(steps[s][2])+'</div>':'')+
                '</div></div>';
      }
    }
    host.innerHTML = html;
  }

  /* ---------- view plumbing ---------- */
  function mobile(){ return window.innerWidth <= 860; }
  function setView(v){
    var sh = document.getElementById('shell');
    sh.className = 'shell v-'+v;
  }
  function render(){
    var isParts = state.tab === 'parts', mob = mobile();
    document.getElementById('tabP').className = 'tab'+(isParts?' on':'');
    document.getElementById('tabC').className = 'tab'+(isParts?'':' on');
    // On a phone the code list and the procedure are separate screens; on a
    // wide screen they sit side by side.
    var showList = !isParts && (!mob || !state.code);
    var showProc = !isParts && (!mob || !!state.code);
    document.getElementById('parts').style.display = isParts ? 'block' : 'none';
    document.getElementById('clist').style.display = showList ? 'flex' : 'none';
    document.getElementById('proc').style.display  = showProc ? 'block' : 'none';
    document.getElementById('bk1').textContent = (!isParts && mob && state.code) ? '\u2039 Codes' : '\u2039 Machines';
    if (isParts) buildParts(); else { buildFilters(); buildCodes(document.getElementById('cs').value); buildProc(); }
  }
  function selectMachine(i){
    state.mi = i; state.code = null; state.filter = 'all'; state.ticks = {};
    var codes = codesFor(i);
    document.getElementById('mname').textContent = MODELS[i][0];
    document.getElementById('ccount').textContent = codes ? '('+Object.keys(codes).length+')' : '(0)';
    document.getElementById('cs').value = '';
    buildMachines(document.getElementById('ms').value);
    render();
    if (mobile()) setView('list');
  }

  /* ---------- events ---------- */
  document.getElementById('ms').addEventListener('input', function(e){ buildMachines(e.target.value); });
  document.getElementById('cs').addEventListener('input', function(e){ buildCodes(e.target.value); });

  document.getElementById('mlist').addEventListener('click', function(e){
    var b = e.target.closest('.mch'); if (!b) return;
    selectMachine(parseInt(b.getAttribute('data-i'),10));
  });
  document.getElementById('tabP').addEventListener('click', function(){ state.tab='parts'; render(); if(mobile()) setView('list'); });
  document.getElementById('tabC').addEventListener('click', function(){ state.tab='codes'; render(); if(mobile()) setView('list'); });

  document.getElementById('filters').addEventListener('click', function(e){
    var b = e.target.closest('.fbtn'); if (!b) return;
    state.filter = b.getAttribute('data-f');
    buildFilters(); buildCodes(document.getElementById('cs').value);
  });
  document.getElementById('crows').addEventListener('click', function(e){
    var b = e.target.closest('.crow'); if (!b) return;
    state.code = b.getAttribute('data-c'); state.ticks = {};
    buildCodes(document.getElementById('cs').value); buildProc();
    if (mobile()) setView('proc'); else document.getElementById('proc').scrollTop = 0;
  });
  document.getElementById('proc').addEventListener('click', function(e){
    var b = e.target.closest('.tick'); if (!b) return;
    var id = b.getAttribute('data-t');
    state.ticks[id] = !state.ticks[id];
    buildProc();
  });

  document.getElementById('parts').addEventListener('click', function(e){
    var cp = e.target.closest('[data-copy]');
    if (cp){
      var txt = cp.getAttribute('data-copy');
      var done = function(){ var o = cp.textContent; cp.textContent='Copied'; setTimeout(function(){ cp.textContent=o; },1100); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done); else done();
      return;
    }
    var rs = e.target.closest('[data-reset]');
    if (rs){ store.del(okey(state.mi, rs.getAttribute('data-reset'))); buildParts(); }
  });
  document.getElementById('parts').addEventListener('change', function(e){
    var inp = e.target.closest('input[data-cat]'); if (!inp) return;
    var cat = inp.getAttribute('data-cat'), v = inp.value.trim();
    if (v) store.set(okey(state.mi,cat), v); else store.del(okey(state.mi,cat));
    buildParts();
  });

  document.getElementById('bk1').addEventListener('click', function(){
    if (state.tab === 'codes' && state.code){ state.code = null; buildCodes(document.getElementById('cs').value); setView('list'); render(); }
    else setView('machines');
  });

  window.addEventListener('resize', function(){
    if (!mobile()) setView('desktop'); else setView(state.code && state.tab==='codes' ? 'proc' : (state.mi>=0 ? 'list' : 'machines'));
    render();
  });

  /* ---------- boot ---------- */
  try {
    decode();
    buildMachines('');
    buildParts();
    if (!mobile()) setView('desktop');
  } catch(err){
    document.getElementById('load').innerHTML =
      '<div style="padding:24px;text-align:center;color:var(--red);text-transform:none;letter-spacing:0">'+
      'Service data failed to load.<br>'+esc(err.message)+'</div>';
    return;
  }
  document.getElementById('load').style.display = 'none';
})();
</script>
</body>
</html>
